services:
  frontend:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    command: pnpm --filter @ai-agent-platform/web dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - pnpm-store:/pnpm/store
      - web-node-modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: pnpm --filter @ai-agent-platform/api dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_agent_platform?schema=public
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_CORS_ORIGINS: http://localhost:3000
      JWT_ACCESS_SECRET: local-dev-access-secret
      JWT_REFRESH_SECRET: local-dev-refresh-secret
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - pnpm-store:/pnpm/store
      - api-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_agent_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  pnpm-store:
  web-node-modules:
  api-node-modules:
